<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Puzzle Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <!-- VIEW 1: Image Picker -->
      <section id="view-images" class="view">
        <header class="view-header">
          <h1>♟ Chess Puzzles</h1>
          <p>Pick a photo to start solving!</p>
        </header>
        <div id="image-grid" class="image-grid"></div>
        <p id="image-message" class="message" hidden></p>
      </section>

      <!-- VIEW 2: Puzzle Grid -->
      <section id="view-puzzles" class="view" hidden>
        <header class="view-header">
          <button id="back-to-images" class="back-button" aria-label="Back to photos">← Back</button>
          <h2 id="puzzle-page-name"></h2>
        </header>
        <div id="puzzle-grid" class="puzzle-grid"></div>
        <p id="puzzle-message" class="message" hidden></p>
      </section>

      <!-- VIEW 3: Single Puzzle -->
      <section id="view-board" class="view" hidden>
        <header class="view-header">
          <button id="back-to-puzzles" class="back-button" aria-label="Back to puzzles">← Back</button>
          <h2 id="board-title"></h2>
        </header>
        <div class="board-layout">
          <div class="source-panel">
            <img id="board-source-img" alt="Source chess diagram" />
            <p id="board-status" class="status-badge"></p>
            <div class="controls">
              <button id="reset-board">Reset</button>
              <button id="edit-board" class="quiet-button">Edit</button>
            </div>
            <div id="palette" class="palette disabled" aria-label="Piece palette"></div>
          </div>
          <div class="editor-panel">
            <div id="chessboard" class="chessboard" role="grid" aria-label="Editable chess board"></div>
            <p class="fen"><span>FEN</span><code id="fen-code"></code></p>
          </div>
        </div>
      </section>
    </main>

    <template id="image-card-template">
      <button class="image-card">
        <div class="image-card-icon">♟</div>
        <span class="image-card-name"></span>
        <span class="image-card-badge"></span>
      </button>
    </template>

    <template id="puzzle-card-template">
      <button class="puzzle-card">
        <img alt="Puzzle crop" />
        <span class="puzzle-number"></span>
        <span class="puzzle-fen-label"></span>
      </button>
    </template>

    <script src="/app.js?v=3"></script>
  </body>
</html>
